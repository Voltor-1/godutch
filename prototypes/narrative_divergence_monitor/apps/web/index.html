<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Narrative Divergence Monitor</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6"><main class="max-w-5xl mx-auto space-y-4"><h1 class="text-3xl font-bold">Narrative Divergence Monitor</h1><p class="text-slate-300">Early demo: compare market signal vs public narrative signal and flag divergence.</p><button id="load" class="px-4 py-2 rounded bg-cyan-500 text-slate-900 font-semibold">Load sample + analyze</button><div id="summary" class="text-sm text-cyan-200"></div><div id="tbl" class="overflow-x-auto"></div></main>
<script>
const $=id=>document.getElementById(id);
$('load').onclick=async()=>{const r=await fetch('/api/sample');const d=await r.json();const alerts=d.points.filter(p=>p.alert).length;$('summary').textContent=`Points: ${d.points.length} | Alerts: ${alerts}`;const rows=d.points.map(p=>`<tr class="border-b border-white/10"><td class="p-2">${p.t}</td><td class="p-2">${p.market}</td><td class="p-2">${p.narrative}</td><td class="p-2">${p.divergence.toFixed(2)}</td><td class="p-2">${p.alert?'⚠️ yes':'-'}</td></tr>`).join('');$('tbl').innerHTML=`<table class="w-full text-sm border border-white/20"><thead><tr class="bg-white/10"><th class="p-2">Time</th><th class="p-2">Market</th><th class="p-2">Narrative</th><th class="p-2">Div.</th><th class="p-2">Alert</th></tr></thead><tbody>${rows}</tbody></table>`;}
</script></body></html>
