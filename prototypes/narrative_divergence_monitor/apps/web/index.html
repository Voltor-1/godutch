<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Narrative Divergence Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <main class="max-w-5xl mx-auto space-y-4">
    <h1 class="text-3xl font-bold">Narrative Divergence Monitor</h1>
    <p class="text-slate-300">Early demo: compare market signal vs public narrative signal and flag divergence.</p>

    <div class="flex flex-wrap items-center gap-3">
      <button id="load" class="px-4 py-2 rounded bg-cyan-500 text-slate-900 font-semibold">Load sample + analyze</button>
      <label class="text-sm flex items-center gap-2"><input id="alertsOnly" type="checkbox"> Alerts only</label>
      <label class="text-sm">Window
        <select id="window" class="ml-1 bg-slate-900 border border-slate-700 rounded px-2 py-1">
          <option value="all">All</option>
          <option value="3">Last 3</option>
          <option value="2">Last 2</option>
        </select>
      </label>
      <label class="text-sm">Alert threshold
        <input id="threshold" type="number" min="0" max="1" step="0.05" value="0.4" class="ml-1 w-20 bg-slate-900 border border-slate-700 rounded px-2 py-1">
      </label>
      <button id="export" class="px-3 py-2 rounded bg-emerald-500 text-slate-900 font-semibold">Export Markdown</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div class="border border-white/20 rounded p-3 bg-slate-900/50"><div class="text-xs text-slate-400">Points analyzed</div><div id="kpiPoints" class="text-2xl font-bold">0</div></div>
      <div class="border border-white/20 rounded p-3 bg-slate-900/50"><div class="text-xs text-slate-400">Alerts</div><div id="kpiAlerts" class="text-2xl font-bold text-rose-300">0</div></div>
      <div class="border border-white/20 rounded p-3 bg-slate-900/50"><div class="text-xs text-slate-400">Max divergence</div><div id="kpiMax" class="text-2xl font-bold text-cyan-300">0.00</div></div>
    </div>

    <div id="summary" class="text-sm text-cyan-200"></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
      <div class="border border-white/20 rounded p-3 bg-slate-900/50">
        <h2 class="font-semibold mb-2">Divergence Trend</h2>
        <canvas id="chart" width="900" height="220" class="w-full bg-slate-950 rounded"></canvas>
      </div>
      <div class="border border-white/20 rounded p-3 bg-slate-900/50">
        <h2 class="font-semibold mb-2">Market vs Narrative</h2>
        <canvas id="lineChart" width="900" height="220" class="w-full bg-slate-950 rounded"></canvas>
      </div>
    </div>
    <div class="border border-white/20 rounded p-3 bg-slate-900/50">
      <h2 class="font-semibold mb-2">Alert Rationale</h2>
      <div id="rationale" class="text-sm text-slate-300">Select an event row to inspect rationale.</div>
    </div>
    <div id="tbl" class="overflow-x-auto"></div>
  </main>

<script>
const $=id=>document.getElementById(id);
let allPoints = [];
let selectedPoint = null;

function filteredPoints() {
  const threshold = Number($('threshold').value || 0.4);
  let pts = allPoints.map(p => ({ ...p, alert: (Math.sign(p.market) !== Math.sign(p.narrative)) && p.divergence >= threshold }));
  const w = $('window').value;
  if (w !== 'all') pts = pts.slice(-Number(w));
  if ($('alertsOnly').checked) pts = pts.filter(p => p.alert);
  return pts;
}

function renderChart(points) {
  const canvas = $('chart');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if (!points.length) {
    ctx.fillStyle = '#94a3b8';
    ctx.font = '16px sans-serif';
    ctx.fillText('No data for selected filters', 20, 40);
    return;
  }

  const max = Math.max(...points.map(p => p.divergence), 1);
  const barW = Math.max(24, Math.floor((canvas.width - 40) / points.length) - 10);
  points.forEach((p, i) => {
    const x = 20 + i * (barW + 10);
    const h = Math.round((p.divergence / max) * 150);
    const y = 180 - h;
    ctx.fillStyle = p.alert ? '#f43f5e' : '#22d3ee';
    ctx.fillRect(x, y, barW, h);
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '12px sans-serif';
    ctx.fillText(p.t, x, 200);
  });

  ctx.strokeStyle = '#334155';
  ctx.beginPath();
  ctx.moveTo(10, 180);
  ctx.lineTo(canvas.width - 10, 180);
  ctx.stroke();
}

function renderLineChart(points) {
  const canvas = $('lineChart');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,canvas.width,canvas.height);
  if (!points.length) return;

  const minV = Math.min(...points.flatMap(p => [p.market, p.narrative]), -1);
  const maxV = Math.max(...points.flatMap(p => [p.market, p.narrative]), 1);
  const toXY = (v, i, len) => {
    const x = 20 + (i * ((canvas.width - 40) / Math.max(1, len-1)));
    const y = 20 + ((maxV - v) / (maxV - minV || 1)) * 160;
    return [x,y];
  };

  function drawSeries(key, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    points.forEach((p,i)=>{ const [x,y]=toXY(p[key],i,points.length); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();
  }

  drawSeries('market', '#22d3ee');
  drawSeries('narrative', '#a78bfa');
  ctx.fillStyle = '#22d3ee'; ctx.fillText('Market', 20, 200);
  ctx.fillStyle = '#a78bfa'; ctx.fillText('Narrative', 90, 200);
}

function renderRationale() {
  if (!selectedPoint) {
    $('rationale').textContent = 'Select an event row to inspect rationale.';
    return;
  }
  const directionMismatch = Math.sign(selectedPoint.market) !== Math.sign(selectedPoint.narrative);
  const reason = directionMismatch
    ? 'Market and narrative move in opposite directions.'
    : 'Signals move in same direction; divergence is magnitude-driven.';
  $('rationale').innerHTML = `<div><b>${selectedPoint.t}</b> — divergence <b>${selectedPoint.divergence.toFixed(2)}</b></div><div>${reason}</div><div class="mt-1">Threshold: ${$('threshold').value} | Alert: ${selectedPoint.alert ? 'Yes' : 'No'}</div>`;
}

function renderTable(points) {
  const rows=points.map((p,idx)=>`<tr data-idx="${idx}" class="border-b border-white/10 hover:bg-white/5 cursor-pointer"><td class="p-2">${p.t}</td><td class="p-2">${p.market}</td><td class="p-2">${p.narrative}</td><td class="p-2">${p.divergence.toFixed(2)}</td><td class="p-2">${p.alert?'⚠️ yes':'-'}</td></tr>`).join('');
  $('tbl').innerHTML=`<table class="w-full text-sm border border-white/20"><thead><tr class="bg-white/10"><th class="p-2">Time</th><th class="p-2">Market</th><th class="p-2">Narrative</th><th class="p-2">Div.</th><th class="p-2">Alert</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="p-3 text-slate-400">No rows for current filter</td></tr>'}</tbody></table>`;
  document.querySelectorAll('tr[data-idx]').forEach(row => row.addEventListener('click', () => {
    selectedPoint = points[Number(row.dataset.idx)] || null;
    renderRationale();
  }));
}

function render() {
  const points = filteredPoints();
  const alerts=points.filter(p=>p.alert).length;
  const maxDiv = points.length ? Math.max(...points.map(p=>p.divergence)) : 0;
  $('summary').textContent=`Points: ${points.length} | Alerts: ${alerts} | Threshold: ${$('threshold').value}`;
  $('kpiPoints').textContent = String(points.length);
  $('kpiAlerts').textContent = String(alerts);
  $('kpiMax').textContent = maxDiv.toFixed(2);
  renderChart(points);
  renderLineChart(points);
  renderTable(points);
  if (!selectedPoint || !points.includes(selectedPoint)) selectedPoint = points[0] || null;
  renderRationale();
}

$('load').onclick=async()=>{
  const r=await fetch('/api/sample');
  const d=await r.json();
  allPoints = d.points || [];
  render();
};

$('alertsOnly').onchange = render;
$('window').onchange = render;
$('threshold').onchange = render;

$('export').onclick = () => {
  const points = filteredPoints();
  const alerts = points.filter(p => p.alert);
  const md = `# Narrative Divergence Summary\n\n- Points analyzed: ${points.length}\n- Alerts: ${alerts.length}\n\n## Alert Events\n${alerts.map(a => {
    const reason = (Math.sign(a.market) !== Math.sign(a.narrative))
      ? 'direction mismatch between market and narrative'
      : 'high magnitude divergence';
    return `- ${a.t}: market ${a.market}, narrative ${a.narrative}, divergence ${a.divergence.toFixed(2)} (${reason})`;
  }).join('\n') || '- None'}\n`;
  const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='narrative-divergence-summary.md'; a.click();
  URL.revokeObjectURL(url);
};
</script>
</body>
</html>
